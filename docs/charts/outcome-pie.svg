<svg id="m-outcome-pie" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 450" style="max-width: 512px;" role="graphics-document document" aria-roledescription="pie"><style>#m-outcome-pie{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#m-outcome-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#m-outcome-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#m-outcome-pie .error-icon{fill:#552222;}#m-outcome-pie .error-text{fill:#552222;stroke:#552222;}#m-outcome-pie .edge-thickness-normal{stroke-width:1px;}#m-outcome-pie .edge-thickness-thick{stroke-width:3.5px;}#m-outcome-pie .edge-pattern-solid{stroke-dasharray:0;}#m-outcome-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#m-outcome-pie .edge-pattern-dashed{stroke-dasharray:3;}#m-outcome-pie .edge-pattern-dotted{stroke-dasharray:2;}#m-outcome-pie .marker{fill:#333333;stroke:#333333;}#m-outcome-pie .marker.cross{stroke:#333333;}#m-outcome-pie svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#m-outcome-pie p{margin:0;}#m-outcome-pie .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#m-outcome-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#m-outcome-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#m-outcome-pie .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#m-outcome-pie .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#m-outcome-pie .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#m-outcome-pie .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#m-outcome-pie .node .neo-node{stroke:#9370DB;}#m-outcome-pie [data-look="neo"].node rect,#m-outcome-pie [data-look="neo"].cluster rect,#m-outcome-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m-outcome-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#m-outcome-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#m-outcome-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m-outcome-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#m-outcome-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m-outcome-pie [data-look="neo"].node circle .state-start{fill:#000000;}#m-outcome-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m-outcome-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-156.201,-99.128L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M-156.201,-99.128A185,185,0,0,1,-89.124,-162.117L0,0Z" fill="#ffffde" class="pieCircle"></path><path d="M-89.124,-162.117A185,185,0,0,1,0,-185L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"></path><text transform="translate(66.84332228161298,121.5875518560861)" style="text-anchor: middle;" class="slice">84%</text><text transform="translate(-94.9809109476055,-101.1443970547209)" style="text-anchor: middle;" class="slice">8%</text><text transform="translate(-34.50572184412367,-134.39091360659754)" style="text-anchor: middle;" class="slice">8%</text></g><text x="0" y="-200" class="pieTitleText">attack_outcome verdicts (23 with output)</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"></rect><text x="22" y="14">correct</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"></rect><text x="22" y="14">wrong</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(181, 255, 32); stroke: rgb(181, 255, 32);"></rect><text x="22" y="14">no output</text></g></g></svg>